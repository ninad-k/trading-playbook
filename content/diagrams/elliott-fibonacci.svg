<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="elliott-fibonacci-t elliott-fibonacci-d" class="diagram"><title id="elliott-fibonacci-t">Elliott five-three wave count with Fibonacci retracement levels</title><desc id="elliott-fibonacci-d">An impulse of five waves followed by a three-wave A-B-C correction, with the common 38.2, 50 and 61.8 percent retracement levels marked.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="320" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><line x1="30" y1="292" x2="692" y2="292" class="d-ax"/><rect x="470" y="40" width="222" height="252" class="d-zone2"/><polyline points="40.0,268.0 130.0,190.0 185.0,232.0 300.0,118.0 365.0,168.0 470.0,70.0 545.0,130.0 600.0,96.0 668.0,152.0" class="d-px"/><circle cx="130" cy="190" r="4" fill="var(--accent,#0b6e4f)"/><text x="130" y="210" class="d-k" text-anchor="middle">1</text><circle cx="185" cy="232" r="4" fill="var(--accent,#0b6e4f)"/><text x="185" y="252" class="d-k" text-anchor="middle">2</text><circle cx="300" cy="118" r="4" fill="var(--accent,#0b6e4f)"/><text x="300" y="106" class="d-k" text-anchor="middle">3</text><circle cx="365" cy="168" r="4" fill="var(--accent,#0b6e4f)"/><text x="365" y="156" class="d-k" text-anchor="middle">4</text><circle cx="470" cy="70" r="4" fill="var(--accent,#0b6e4f)"/><text x="470" y="58" class="d-k" text-anchor="middle">5</text><circle cx="545" cy="130" r="4" fill="var(--accent2,#b8862b)"/><text x="545" y="118" class="d-k2" text-anchor="middle">A</text><circle cx="600" cy="96" r="4" fill="var(--accent2,#b8862b)"/><text x="600" y="84" class="d-k2" text-anchor="middle">B</text><circle cx="668" cy="152" r="4" fill="var(--accent2,#b8862b)"/><text x="668" y="140" class="d-k2" text-anchor="middle">C</text><text x="255" y="60" class="d-k" text-anchor="middle">five-wave impulse</text><text x="580" y="60" class="d-k2" text-anchor="middle">three-wave correction</text><line x1="185" y1="161.5" x2="330" y2="161.5" class="d-grid"/><text x="180" y="165.548" class="d-s" text-anchor="end">38.2%</text><line x1="185" y1="175.0" x2="330" y2="175.0" class="d-grid"/><text x="180" y="179.0" class="d-s" text-anchor="end">50%</text><line x1="185" y1="188.5" x2="330" y2="188.5" class="d-grid"/><text x="180" y="192.452" class="d-s" text-anchor="end">61.8%</text><text x="40" y="312" class="d-s" text-anchor="start">Wave labels and retracement ratios are the vocabulary; the notes record where each author disagrees about applying them.</text></svg>
