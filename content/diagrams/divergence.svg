<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="divergence-t divergence-d" class="diagram"><title id="divergence-t">Bearish divergence between price and an oscillator</title><desc id="divergence-d">Two stacked panels. The upper price panel makes a higher high while the lower oscillator panel makes a lower high at the same bar.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="344" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><text x="40" y="28" class="d-t" text-anchor="start">Price</text><polyline points="40.0,150.0 110.0,90.0 160.0,125.0 240.0,105.0 300.0,130.0 380.0,62.0 450.0,108.0 530.0,58.0 600.0,120.0 680.0,165.0" class="d-px"/><line x1="380" y1="62" x2="530" y2="58" class="d-hi"/><circle cx="380" cy="62" r="4" fill="var(--accent,#0b6e4f)"/><circle cx="530" cy="58" r="4" fill="var(--accent,#0b6e4f)"/><text x="455" y="44" class="d-k" text-anchor="middle">higher high</text><line x1="30" y1="185" x2="692" y2="185" class="d-ax"/><text x="40" y="210" class="d-t" text-anchor="start">Oscillator</text><polyline points="40.0,285.0 110.0,245.0 160.0,268.0 240.0,250.0 300.0,272.0 380.0,224.0 450.0,262.0 530.0,245.0 600.0,275.0 680.0,292.0" class="d-px"/><line x1="380" y1="224" x2="530" y2="245" class="d-hi2"/><circle cx="380" cy="224" r="4" fill="var(--accent2,#b8862b)"/><circle cx="530" cy="245" r="4" fill="var(--accent2,#b8862b)"/><text x="455" y="300" class="d-k2" text-anchor="middle">lower high</text><line x1="530" y1="70" x2="530" y2="238" class="d-grid"/><text x="546" y="160" class="d-s" text-anchor="start">same bar</text><text x="40" y="330" class="d-s" text-anchor="start">Bearish divergence: price prints a higher high, the oscillator does not. The reverse pattern at lows is bullish divergence.</text></svg>
