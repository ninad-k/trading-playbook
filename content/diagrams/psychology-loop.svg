<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="psychology-loop-t psychology-loop-d" class="diagram"><title id="psychology-loop-t">The discipline loop described across the psychology books</title><desc id="psychology-loop-d">A six-stage cycle running from setting a rule, through a loss, widening the rule, a larger loss, and a break in confidence, back to setting a rule.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="384" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><circle cx="360.0" cy="60.0" r="7" fill="var(--accent,#0b6e4f)"/><text x="360.0" y="42.0" class="d-k" text-anchor="middle">A rule is set</text><path d="M381.7,62.1 A116,116 0 0 1 430.1,83.6" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><circle cx="460.5" cy="118.0" r="7" fill="var(--accent2,#b8862b)"/><text x="478.45894683899485" y="123.0" class="d-s" text-anchor="start">A loss arrives</text><path d="M469.5,137.9 A116,116 0 0 1 475.1,190.5" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><circle cx="460.5" cy="234.0" r="7" fill="var(--accent2,#b8862b)"/><text x="478.4589468389949" y="238.99999999999997" class="d-s" text-anchor="start">The rule feels wrong</text><path d="M447.8,251.8 A116,116 0 0 1 405.0,282.9" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><circle cx="360.0" cy="292.0" r="7" fill="var(--accent2,#b8862b)"/><text x="360.0" y="318.0" class="d-s" text-anchor="middle">The rule is widened</text><path d="M338.3,289.9 A116,116 0 0 1 289.9,268.4" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><circle cx="259.5" cy="234.0" r="7" fill="var(--accent2,#b8862b)"/><text x="241.54105316100515" y="239.00000000000003" class="d-s" text-anchor="end">A larger loss arrives</text><path d="M250.5,214.1 A116,116 0 0 1 244.9,161.5" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><circle cx="259.5" cy="118.0" r="7" fill="var(--accent2,#b8862b)"/><text x="241.54105316100515" y="122.99999999999999" class="d-s" text-anchor="end">Confidence breaks</text><path d="M272.2,100.2 A116,116 0 0 1 315.0,69.1" fill="none" stroke="var(--accent2,#b8862b)" stroke-width="1.8" marker-end="url(#ar2)"/><text x="360" y="170" class="d-t" text-anchor="middle">The loop</text><text x="360" y="190" class="d-s" text-anchor="middle">every discipline book</text><text x="360" y="208" class="d-s" text-anchor="middle">is trying to break</text><text x="40" y="352" class="d-s" text-anchor="start">The books differ on the remedy: written plans, smaller size, fixed review intervals, walking away.</text><text x="40" y="370" class="d-s" text-anchor="start">They do not differ much on the sequence.</text></svg>
