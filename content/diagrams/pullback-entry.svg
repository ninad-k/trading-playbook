<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="pullback-entry-t pullback-entry-d" class="diagram"><title id="pullback-entry-t">Swing entry on a pullback, with stop and R-multiple targets</title><desc id="pullback-entry-d">An uptrending price line pulling back to an entry level, with a stop below the pullback low and targets at one and two times the entry-to-stop distance.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="348" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><line x1="30" y1="300" x2="692" y2="300" class="d-ax"/><polyline points="40.0,262.0 110.0,210.0 150.0,238.0 215.0,176.0 268.0,205.0 330.0,168.0 395.0,132.0 470.0,152.0 540.0,100.0 610.0,118.0 672.0,72.0" class="d-px"/><line x1="330" y1="208" x2="640" y2="208" stroke="var(--accent2,#b8862b)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="646" y="212" class="d-k2" text-anchor="start">stop</text><line x1="330" y1="168" x2="640" y2="168" stroke="var(--accent,#0b6e4f)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="646" y="172" class="d-k" text-anchor="start">entry</text><line x1="330" y1="128" x2="640" y2="128" stroke="var(--muted,#6b6b66)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="646" y="132" class="d-s" text-anchor="start">target 1</text><line x1="330" y1="88" x2="640" y2="88" stroke="var(--muted,#6b6b66)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="646" y="92" class="d-s" text-anchor="start">target 2</text><rect x="330" y="168" width="310" height="40" class="d-zone2"/><rect x="330" y="128" width="310" height="40" class="d-zone"/><text x="340" y="194" class="d-k2" text-anchor="start">1R of risk</text><text x="340" y="158" class="d-k" text-anchor="start">1R of reward</text><circle cx="330" cy="168" r="5" fill="var(--accent,#0b6e4f)"/><text x="40" y="40" class="d-s" text-anchor="start">Trend already established</text><text x="40" y="316" class="d-s" text-anchor="start">R is the distance from entry to stop.</text><text x="40" y="332" class="d-s" text-anchor="start">Sizing so that 1R is a fixed fraction of the account is what makes targets comparable across trades.</text></svg>
