<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="footprint-delta-t footprint-delta-d" class="diagram"><title id="footprint-delta-t">Footprint cells showing bid, ask and delta</title><desc id="footprint-delta-d">Three bars broken into price rows showing volume traded at the bid and at the ask, with imbalanced cells shaded and a delta total beneath each bar.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="348" rx="8" class="d-bg"/><text x="40" y="34" class="d-t" text-anchor="start">One bar, opened up: what traded at each price</text><text x="190" y="62" class="d-s" text-anchor="start">bid &#215; ask, price by price</text><rect x="190" y="78" width="136" height="38" rx="4" fill="var(--accent,#0b6e4f)" opacity=".2"/><rect x="190" y="78" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="236" y="103" class="d-s" text-anchor="end">12</text><text x="244" y="103" class="d-s" text-anchor="start">&#215;</text><text x="264" y="103" class="d-n" text-anchor="start">40</text><rect x="190" y="124" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="236" y="149" class="d-s" text-anchor="end">34</text><text x="244" y="149" class="d-s" text-anchor="start">&#215;</text><text x="264" y="149" class="d-s" text-anchor="start">61</text><rect x="190" y="170" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="236" y="195" class="d-s" text-anchor="end">88</text><text x="244" y="195" class="d-s" text-anchor="start">&#215;</text><text x="264" y="195" class="d-s" text-anchor="start">52</text><rect x="190" y="216" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="236" y="241" class="d-s" text-anchor="end">41</text><text x="244" y="241" class="d-s" text-anchor="start">&#215;</text><text x="264" y="241" class="d-s" text-anchor="start">30</text><text x="258.0" y="286" class="d-k" text-anchor="middle">delta +8</text><rect x="348" y="78" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="394" y="103" class="d-s" text-anchor="end">22</text><text x="402" y="103" class="d-s" text-anchor="start">&#215;</text><text x="422" y="103" class="d-s" text-anchor="start">18</text><rect x="348" y="124" width="136" height="38" rx="4" fill="var(--accent2,#b8862b)" opacity=".2"/><rect x="348" y="124" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="394" y="149" class="d-s" text-anchor="end">96</text><text x="402" y="149" class="d-s" text-anchor="start">&#215;</text><text x="422" y="149" class="d-n" text-anchor="start">31</text><rect x="348" y="170" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="394" y="195" class="d-s" text-anchor="end">57</text><text x="402" y="195" class="d-s" text-anchor="start">&#215;</text><text x="422" y="195" class="d-s" text-anchor="start">44</text><rect x="348" y="216" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="394" y="241" class="d-s" text-anchor="end">19</text><text x="402" y="241" class="d-s" text-anchor="start">&#215;</text><text x="422" y="241" class="d-s" text-anchor="start">26</text><text x="416.0" y="286" class="d-k2" text-anchor="middle">delta -75</text><rect x="506" y="78" width="136" height="38" rx="4" fill="var(--accent,#0b6e4f)" opacity=".2"/><rect x="506" y="78" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="552" y="103" class="d-s" text-anchor="end">9</text><text x="560" y="103" class="d-s" text-anchor="start">&#215;</text><text x="580" y="103" class="d-n" text-anchor="start">55</text><rect x="506" y="124" width="136" height="38" rx="4" fill="var(--accent,#0b6e4f)" opacity=".2"/><rect x="506" y="124" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="552" y="149" class="d-s" text-anchor="end">28</text><text x="560" y="149" class="d-s" text-anchor="start">&#215;</text><text x="580" y="149" class="d-n" text-anchor="start">92</text><rect x="506" y="170" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="552" y="195" class="d-s" text-anchor="end">44</text><text x="560" y="195" class="d-s" text-anchor="start">&#215;</text><text x="580" y="195" class="d-s" text-anchor="start">60</text><rect x="506" y="216" width="136" height="38" rx="4" fill="none" stroke="var(--line,#e4e2dc)"/><text x="552" y="241" class="d-s" text-anchor="end">33</text><text x="560" y="241" class="d-s" text-anchor="start">&#215;</text><text x="580" y="241" class="d-s" text-anchor="start">21</text><text x="574.0" y="286" class="d-k" text-anchor="middle">delta +114</text><text x="40" y="96" class="d-s" text-anchor="start">Bid volume is what</text><text x="40" y="114" class="d-s" text-anchor="start">sellers hit; ask volume</text><text x="40" y="132" class="d-s" text-anchor="start">is what buyers lifted.</text><text x="40" y="176" class="d-s" text-anchor="start">A shaded cell is an</text><text x="40" y="194" class="d-s" text-anchor="start">imbalance: one side far</text><text x="40" y="212" class="d-s" text-anchor="start">outweighed the other.</text><text x="40" y="314" class="d-s" text-anchor="start">Delta is the running difference. It records who was more aggressive &#8212; a statement about what</text><text x="40" y="332" class="d-s" text-anchor="start">already happened, not a forecast of the next bar.</text></svg>
