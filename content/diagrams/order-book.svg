<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="order-book-t order-book-d" class="diagram"><title id="order-book-t">A limit order book with bids, asks, spread and depth</title><desc id="order-book-d">A price ladder showing resting sell orders above and buy orders below, separated by the spread, with bar lengths standing for the size resting at each price.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="350" rx="8" class="d-bg"/><text x="40" y="32" class="d-t" text-anchor="start">One moment of a limit order book</text><rect x="360" y="60" width="90" height="20" fill="var(--accent2,#b8862b)" opacity=".35"/><text x="352" y="75" class="d-s" text-anchor="end">1.0847</text><text x="456" y="75" class="d-s" text-anchor="start">90</text><rect x="360" y="86" width="148" height="20" fill="var(--accent2,#b8862b)" opacity=".35"/><text x="352" y="101" class="d-s" text-anchor="end">1.0846</text><text x="514" y="101" class="d-s" text-anchor="start">148</text><rect x="360" y="112" width="62" height="20" fill="var(--accent2,#b8862b)" opacity=".35"/><text x="352" y="127" class="d-s" text-anchor="end">1.0845</text><text x="428" y="127" class="d-s" text-anchor="start">62</text><rect x="360" y="138" width="210" height="20" fill="var(--accent2,#b8862b)" opacity=".35"/><text x="352" y="153" class="d-s" text-anchor="end">1.0844</text><text x="576" y="153" class="d-s" text-anchor="start">210</text><line x1="200" y1="170" x2="620" y2="170" stroke="var(--fg,#1c1c1a)" stroke-width="2"/><text x="190" y="175" class="d-t" text-anchor="end">spread</text><rect x="360" y="182" width="176" height="20" fill="var(--accent,#0b6e4f)" opacity=".35"/><text x="352" y="197" class="d-s" text-anchor="end">1.0842</text><text x="542" y="197" class="d-s" text-anchor="start">176</text><rect x="360" y="208" width="84" height="20" fill="var(--accent,#0b6e4f)" opacity=".35"/><text x="352" y="223" class="d-s" text-anchor="end">1.0841</text><text x="450" y="223" class="d-s" text-anchor="start">84</text><rect x="360" y="234" width="132" height="20" fill="var(--accent,#0b6e4f)" opacity=".35"/><text x="352" y="249" class="d-s" text-anchor="end">1.0840</text><text x="498" y="249" class="d-s" text-anchor="start">132</text><rect x="360" y="260" width="240" height="20" fill="var(--accent,#0b6e4f)" opacity=".35"/><text x="352" y="275" class="d-s" text-anchor="end">1.0839</text><text x="606" y="275" class="d-s" text-anchor="start">240</text><text x="560" y="52" class="d-k2" text-anchor="start">asks — sellers</text><text x="560" y="300" class="d-k" text-anchor="start">bids — buyers</text><text x="40" y="80" class="d-t" text-anchor="start">A market order</text><text x="40" y="102" class="d-s" text-anchor="start">crosses the spread</text><text x="40" y="120" class="d-s" text-anchor="start">and eats the resting</text><text x="40" y="138" class="d-s" text-anchor="start">size nearest to it.</text><text x="40" y="172" class="d-s" text-anchor="start">A large order walks</text><text x="40" y="190" class="d-s" text-anchor="start">up the ladder and</text><text x="40" y="208" class="d-s" text-anchor="start">pays a worse average</text><text x="40" y="226" class="d-s" text-anchor="start">price. That gap is</text><text x="40" y="244" class="d-k" text-anchor="start">market impact.</text><text x="40" y="318" class="d-s" text-anchor="start">Microstructure research here is largely about measuring the spread, the depth and the impact</text><text x="40" y="336" class="d-s" text-anchor="start">— the costs a backtest on closing prices cannot see.</text></svg>
