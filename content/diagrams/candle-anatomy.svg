<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="candle-anatomy-t candle-anatomy-d" class="diagram"><title id="candle-anatomy-t">Candlestick anatomy and three common shapes</title><desc id="candle-anatomy-d">A labelled candlestick showing high, low, open and close, beside a doji, a hammer and a bullish engulfing pair.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="300" rx="8" class="d-bg"/><text x="40" y="34" class="d-t" text-anchor="start">Anatomy</text><line x1="86" y1="70" x2="86" y2="230" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><rect x="70" y="110" width="32" height="80" class="d-up"/><line x1="106" y1="70" x2="140" y2="70" class="d-grid"/><text x="146" y="74" class="d-s" text-anchor="start">high</text><line x1="106" y1="110" x2="140" y2="110" class="d-grid"/><text x="146" y="114" class="d-s" text-anchor="start">close</text><line x1="106" y1="190" x2="140" y2="190" class="d-grid"/><text x="146" y="194" class="d-s" text-anchor="start">open</text><line x1="106" y1="230" x2="140" y2="230" class="d-grid"/><text x="146" y="234" class="d-s" text-anchor="start">low</text><text x="86" y="254" class="d-s" text-anchor="middle">one bar =<tspan> one period</tspan></text><line x1="215" y1="50" x2="215" y2="270" class="d-ax"/><text x="285" y="34" class="d-t" text-anchor="middle">Doji</text><text x="285" y="262" class="d-s" text-anchor="middle">open &#8776; close</text><text x="415" y="34" class="d-t" text-anchor="middle">Hammer</text><text x="415" y="262" class="d-s" text-anchor="middle">long lower wick</text><text x="560" y="34" class="d-t" text-anchor="middle">Engulfing</text><text x="560" y="262" class="d-s" text-anchor="middle">body covers prior body</text><line x1="285" y1="90" x2="285" y2="200" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><rect x="269" y="142" width="32" height="4" class="d-dn"/><line x1="415" y1="96" x2="415" y2="215" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><rect x="399" y="96" width="32" height="36" class="d-up"/><line x1="540" y1="120" x2="540" y2="185" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><rect x="528" y="132" width="24" height="34" class="d-dn"/><line x1="582" y1="100" x2="582" y2="205" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><rect x="568" y="118" width="28" height="66" class="d-up"/><text x="40" y="288" class="d-s" text-anchor="start">Shapes only. Whether any pattern carries an edge is argued case by case in the notes.</text></svg>
