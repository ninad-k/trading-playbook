<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="chart-patterns-t chart-patterns-d" class="diagram"><title id="chart-patterns-t">Three classical chart patterns read as swing structure</title><desc id="chart-patterns-d">A double top, a head and shoulders and an ascending triangle, each annotated with the swing highs and lows that produce it.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="300" rx="8" class="d-bg"/><text x="40" y="32" class="d-t" text-anchor="start">Three patterns, and the structure each one actually is</text><text x="141.0" y="62" class="d-t" text-anchor="middle">Double top</text><line x1="48" y1="194" x2="234" y2="194" class="d-ax"/><polyline points="48.0,194.0 85.2,92.0 118.7,148.4 152.2,94.4 193.1,160.4 234.0,188.0" class="d-px"/><circle cx="85.2" cy="92.0" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="85.2" y="83.0" class="d-k" text-anchor="middle">H</text><circle cx="152.2" cy="94.4" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="152.16000000000003" y="85.4" class="d-k" text-anchor="middle">H</text><text x="141.0" y="220" class="d-s" text-anchor="middle">a failure to make a higher high</text><text x="359.0" y="62" class="d-t" text-anchor="middle">Head and shoulders</text><line x1="266" y1="194" x2="452" y2="194" class="d-ax"/><polyline points="266.0,194.0 292.0,124.4 314.4,155.6 347.8,81.2 377.6,153.2 407.4,119.6 452.0,184.4" class="d-px"/><circle cx="347.8" cy="81.2" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="347.84000000000003" y="72.2" class="d-k" text-anchor="middle">head</text><circle cx="292.0" cy="124.4" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="292.04" y="115.4" class="d-k" text-anchor="middle">S</text><circle cx="407.4" cy="119.6" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="407.36" y="110.6" class="d-k" text-anchor="middle">S</text><text x="359.0" y="220" class="d-s" text-anchor="middle">the same failure, one peak later</text><text x="577.0" y="62" class="d-t" text-anchor="middle">Ascending triangle</text><line x1="484" y1="194" x2="670" y2="194" class="d-ax"/><polyline points="484.0,177.2 513.8,93.2 539.8,148.4 569.6,95.6 595.6,126.8 625.4,94.4 647.7,112.4 670.0,80.0" class="d-px"/><circle cx="539.8" cy="148.4" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="539.8" y="165.4" class="d-k" text-anchor="middle">HL</text><circle cx="595.6" cy="126.8" r="3.5" fill="var(--accent,#0b6e4f)"/><text x="595.6" y="143.8" class="d-k" text-anchor="middle">HL</text><text x="577.0" y="220" class="d-s" text-anchor="middle">a range with rising lows</text><line x1="484" y1="91" x2="670" y2="91" class="d-dash"/><text x="40" y="254" class="d-s" text-anchor="start">None of these is a new idea. Each is the swing structure from stage 3, seen from a little further back &#8212;</text><text x="40" y="272" class="d-k" text-anchor="start">which is why you can read one that nobody has given a name to.</text></svg>
