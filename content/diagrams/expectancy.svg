<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-labelledby="expectancy-t expectancy-d" class="diagram"><title id="expectancy-t">Expectancy from a distribution of R multiples</title><desc id="expectancy-d">A bar chart of trade outcomes in R multiples where losers outnumber winners, with the expectancy arithmetic beside it showing a positive result per trade.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="336" rx="8" class="d-bg"/><text x="40" y="34" class="d-t" text-anchor="start">A 40% win rate that still makes money</text><text x="40" y="60" class="d-s" text-anchor="start">Outcome of 100 trades, measured in R</text><rect x="80" y="98" width="76" height="138" rx="3" fill="var(--accent2,#b8862b)"/><text x="118.0" y="90.0" class="d-n" text-anchor="middle">60%</text><text x="118.0" y="257" class="d-t" text-anchor="middle">&#8722;1R</text><rect x="196" y="195" width="76" height="41" rx="3" fill="var(--accent,#0b6e4f)"/><text x="234.0" y="186.6" class="d-n" text-anchor="middle">18%</text><text x="234.0" y="257" class="d-t" text-anchor="middle">+1R</text><rect x="312" y="208" width="76" height="28" rx="3" fill="var(--accent,#0b6e4f)"/><text x="350.0" y="200.4" class="d-n" text-anchor="middle">12%</text><text x="350.0" y="257" class="d-t" text-anchor="middle">+2R</text><rect x="428" y="213" width="76" height="23" rx="3" fill="var(--accent,#0b6e4f)"/><text x="466.0" y="205.0" class="d-n" text-anchor="middle">10%</text><text x="466.0" y="257" class="d-t" text-anchor="middle">+3R</text><line x1="64" y1="236" x2="486" y2="236" class="d-ax"/><text x="516" y="96" class="d-t" text-anchor="start">40 winners, 60 losers.</text><text x="516" y="126" class="d-s" text-anchor="start">(0.18&#215;1) + (0.12&#215;2) + (0.10&#215;3)</text><text x="516" y="144" class="d-s" text-anchor="start">&#8722; (0.60&#215;1)</text><line x1="516" y1="156" x2="686" y2="156" stroke="var(--line,#e4e2dc)"/><text x="516" y="178" class="d-k" text-anchor="start">= +0.12R per trade</text><text x="516" y="208" class="d-s" text-anchor="start">Losing six times in ten</text><text x="516" y="226" class="d-s" text-anchor="start">and still gaining, because</text><text x="516" y="244" class="d-s" text-anchor="start">the winners are bigger.</text><text x="40" y="288" class="d-s" text-anchor="start">Expectancy, not win rate, decides whether a method survives. A 70% win rate with one large loss in</text><text x="40" y="306" class="d-s" text-anchor="start">the tail is a losing system, and it feels like a winning one right up until it is not.</text><text x="40" y="328" class="d-s" text-anchor="start">Illustrative arithmetic. It is not a result from any tested method.</text></svg>
