<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="position-sizing-t position-sizing-d" class="diagram"><title id="position-sizing-t">Position sizing inputs and the drawdown-recovery curve</title><desc id="position-sizing-d">Account equity times risk percent divided by stop distance gives position size; beside it a curve showing the gain required to recover from a given drawdown.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="400" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><text x="40" y="34" class="d-t" text-anchor="start">Sizing from risk, not from conviction</text><rect x="40" y="52" width="176" height="46" rx="8" fill="none" stroke="var(--line,#e4e2dc)"/><text x="128.0" y="80" class="d-s" text-anchor="middle">Account equity</text><rect x="244" y="52" width="176" height="46" rx="8" fill="none" stroke="var(--line,#e4e2dc)"/><text x="332.0" y="80" class="d-s" text-anchor="middle">Risk per trade (%)</text><rect x="448" y="52" width="176" height="46" rx="8" fill="none" stroke="var(--line,#e4e2dc)"/><text x="536.0" y="80" class="d-s" text-anchor="middle">Stop distance</text><text x="228" y="82" class="d-t" text-anchor="middle">&#215;</text><text x="432" y="82" class="d-t" text-anchor="middle">&#247;</text><line x1="360" y1="102" x2="360" y2="126" stroke="var(--accent,#0b6e4f)" stroke-width="2" marker-end="url(#ar)"/><rect x="272" y="130" width="176" height="46" rx="8" fill="none" stroke="var(--accent,#0b6e4f)" stroke-width="2"/><text x="360" y="158" class="d-k" text-anchor="middle">Position size</text><text x="360" y="200" class="d-s" text-anchor="middle">Two of the three inputs are chosen before the trade exists.</text><text x="360" y="218" class="d-s" text-anchor="middle">Only the stop distance comes from the chart.</text><line x1="74" y1="356" x2="366" y2="356" class="d-ax"/><line x1="74" y1="248" x2="74" y2="356" class="d-ax"/><polyline points="74.0,356.0 78.2,355.5 82.3,355.1 86.5,354.6 90.7,354.1 94.9,353.6 99.0,353.1 103.2,352.6 107.4,352.1 111.5,351.5 115.7,351.0 119.9,350.4 124.1,349.9 128.2,349.3 132.4,348.7 136.6,348.1 140.7,347.4 144.9,346.8 149.1,346.1 153.3,345.4 157.4,344.8 161.6,344.0 165.8,343.3 169.9,342.6 174.1,341.8 178.3,341.0 182.5,340.2 186.6,339.4 190.8,338.5 195.0,337.6 199.1,336.7 203.3,335.8 207.5,334.8 211.7,333.8 215.8,332.8 220.0,331.8 224.2,330.7 228.3,329.6 232.5,328.4 236.7,327.2 240.9,326.0 245.0,324.7 249.2,323.4 253.4,322.1 257.5,320.6 261.7,319.2 265.9,317.7 270.1,316.1 274.2,314.5 278.4,312.8 282.6,311.0 286.7,309.2 290.9,307.2 295.1,305.3 299.3,303.2 303.4,301.0 307.6,298.7 311.8,296.3 315.9,293.9 320.1,291.2 324.3,288.5 328.5,285.6 332.6,282.6 336.8,279.4 341.0,276.0 345.1,272.4 349.3,268.6 353.5,264.6 357.7,260.4 361.8,255.8 366.0,251.0" class="d-hi2"/><text x="74" y="236" class="d-s" text-anchor="start">gain needed to get back to even</text><text x="366" y="376" class="d-s" text-anchor="end">drawdown &#8594;</text><circle cx="157.4" cy="344.8" r="4" fill="var(--accent2,#b8862b)"/><text x="167.42857142857144" y="336.75" class="d-k2" text-anchor="start">20% needs 25%</text><circle cx="282.6" cy="311.0" r="4" fill="var(--accent2,#b8862b)"/><text x="276.57142857142856" y="299.0" class="d-k2" text-anchor="end">50% needs 100%</text><circle cx="345.1" cy="272.4" r="4" fill="var(--accent2,#b8862b)"/><text x="331.14285714285717" y="296.42857142857144" class="d-k2" text-anchor="end">65% needs 186%</text><text x="410" y="252" class="d-t" text-anchor="start">Why the size rule matters</text><text x="410" y="278" class="d-s" text-anchor="start">Recovering a loss takes a bigger gain than the</text><text x="410" y="297" class="d-s" text-anchor="start">loss itself, and the gap widens fast. That is</text><text x="410" y="316" class="d-s" text-anchor="start">arithmetic, not a claim about any method — and</text><text x="410" y="335" class="d-s" text-anchor="start">it is the reason nearly every book in the library</text><text x="410" y="354" class="d-s" text-anchor="start">caps risk per trade at a few percent.</text></svg>
