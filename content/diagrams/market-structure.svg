<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="market-structure-t market-structure-d" class="diagram"><title id="market-structure-t">Swing structure and break of structure</title><desc id="market-structure-d">A price line making higher highs and higher lows, then failing to hold the last higher low and turning into a sequence of lower highs and lower lows.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="300" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><line x1="30" y1="268" x2="692" y2="268" class="d-ax"/><rect x="320" y="30" width="372" height="238" class="d-zone2"/><line x1="255" y1="156" x2="430" y2="156" class="d-dash"/><polyline points="40.0,235.0 110.0,162.0 150.0,192.0 215.0,120.0 255.0,156.0 320.0,78.0 382.0,142.0 430.0,112.0 500.0,182.0 548.0,150.0 620.0,218.0 680.0,236.0" class="d-px"/><circle cx="110" cy="162" r="4" fill="var(--accent,#0b6e4f)"/><text x="110" y="150" class="d-k" text-anchor="middle">HH</text><circle cx="215" cy="120" r="4" fill="var(--accent,#0b6e4f)"/><text x="215" y="108" class="d-k" text-anchor="middle">HH</text><circle cx="320" cy="78" r="4" fill="var(--accent,#0b6e4f)"/><text x="320" y="66" class="d-k" text-anchor="middle">HH</text><circle cx="150" cy="192" r="4" fill="var(--accent,#0b6e4f)"/><text x="150" y="212" class="d-k" text-anchor="middle">HL</text><circle cx="255" cy="156" r="4" fill="var(--accent,#0b6e4f)"/><text x="255" y="176" class="d-k" text-anchor="middle">HL</text><circle cx="430" cy="112" r="4" fill="var(--accent2,#b8862b)"/><text x="430" y="100" class="d-k2" text-anchor="middle">LH</text><circle cx="548" cy="150" r="4" fill="var(--accent2,#b8862b)"/><text x="548" y="138" class="d-k2" text-anchor="middle">LH</text><circle cx="500" cy="182" r="4" fill="var(--accent2,#b8862b)"/><text x="500" y="202" class="d-k2" text-anchor="middle">LL</text><circle cx="620" cy="218" r="4" fill="var(--accent2,#b8862b)"/><text x="620" y="238" class="d-k2" text-anchor="middle">LL</text><circle cx="382" cy="142" r="4" fill="var(--accent2,#b8862b)"/><line x1="382" y1="138" x2="382" y2="116" stroke="var(--accent2,#b8862b)" stroke-width="1.4"/><text x="382" y="108" class="d-k2" text-anchor="middle">break of structure</text><text x="150" y="52" class="d-s" text-anchor="start">Uptrend: each high above the last, each low above the last</text><text x="560" y="60" class="d-k2" text-anchor="middle">Downtrend</text><text x="40" y="288" class="d-s" text-anchor="start">The first lower low after a run of higher lows is the signal that structure has changed.</text></svg>
