<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="forex-quote-t forex-quote-d" class="diagram"><title id="forex-quote-t">Anatomy of a foreign-exchange quote</title><desc id="forex-quote-d">A EUR/USD quote broken into base and quote currency, bid and ask price, the spread between them and the size of one pip.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="300" rx="8" class="d-bg"/><text x="40" y="40" class="d-t" text-anchor="start">EUR / USD</text><text x="40" y="62" class="d-k" text-anchor="start">base</text><text x="112" y="62" class="d-k2" text-anchor="start">quote</text><line x1="46" y1="46" x2="46" y2="52" stroke="var(--accent,#0b6e4f)" stroke-width="2"/><line x1="126" y1="46" x2="126" y2="52" stroke="var(--accent2,#b8862b)" stroke-width="2"/><text x="40" y="92" class="d-s" text-anchor="start">One unit of the base currency, priced in the quote currency.</text><line x1="40" y1="112" x2="680" y2="112" class="d-ax"/><text x="120" y="148" class="d-k2" text-anchor="middle">bid</text><text x="120" y="196" class="d-t" text-anchor="middle" style="font-size:30px">1.0842</text><text x="400" y="148" class="d-k" text-anchor="middle">ask</text><text x="400" y="196" class="d-t" text-anchor="middle" style="font-size:30px">1.0844</text><text x="120" y="218" class="d-s" text-anchor="middle">you sell here</text><text x="400" y="218" class="d-s" text-anchor="middle">you buy here</text><line x1="180" y1="186" x2="340" y2="186" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><line x1="180" y1="180" x2="180" y2="192" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><line x1="340" y1="180" x2="340" y2="192" stroke="var(--fg,#1c1c1a)" stroke-width="1.5"/><text x="260" y="176" class="d-t" text-anchor="middle">spread = 2 pips</text><line x1="560" y1="160" x2="560" y2="182" stroke="var(--accent,#0b6e4f)" stroke-width="2"/><text x="560" y="150" class="d-k" text-anchor="middle">1 pip</text><text x="560" y="200" class="d-s" text-anchor="middle">the 4th decimal</text><text x="560" y="220" class="d-s" text-anchor="middle">(2nd for JPY pairs)</text><text x="40" y="258" class="d-s" text-anchor="start">The spread is the cost you pay on entry, before any commission or swap. It is the first number most retail systems ignore.</text><text x="40" y="280" class="d-s" text-anchor="start">Prices shown are an illustration, not a quote.</text></svg>
