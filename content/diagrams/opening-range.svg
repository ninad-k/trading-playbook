<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="opening-range-t opening-range-d" class="diagram"><title id="opening-range-t">Opening-range breakout</title><desc id="opening-range-d">A session where the first N minutes define a high and a low; price later breaks above the high, which is the entry, with the opposite side of the range as the stop.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="330" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><line x1="30" y1="292" x2="692" y2="292" class="d-ax"/><rect x="60" y="120" width="170" height="76" class="d-zone"/><line x1="60" y1="120" x2="660" y2="120" class="d-dash"/><line x1="60" y1="196" x2="660" y2="196" class="d-dash"/><polyline points="60.0,170.0 95.0,132.0 125.0,188.0 160.0,140.0 195.0,190.0 230.0,128.0 280.0,104.0 330.0,132.0 380.0,86.0 440.0,108.0 510.0,60.0 580.0,92.0 660.0,48.0" class="d-px"/><text x="145" y="112" class="d-k" text-anchor="middle">opening range</text><text x="145" y="214" class="d-s" text-anchor="middle">first N minutes</text><text x="668" y="124" class="d-k" text-anchor="start">high</text><text x="668" y="200" class="d-k" text-anchor="start">low</text><line x1="262" y1="150" x2="262" y2="118" stroke="var(--accent,#0b6e4f)" stroke-width="2" marker-end="url(#ar)"/><text x="266" y="162" class="d-k" text-anchor="start">break above &#8594; long</text><line x1="240" y1="196" x2="640" y2="196" stroke="var(--accent2,#b8862b)" stroke-width="2" stroke-dasharray="4 4"/><text x="560" y="214" class="d-k2" text-anchor="middle">stop: other side of the range</text><line x1="60" y1="262" x2="660" y2="262" class="d-ax"/><line x1="60" y1="256" x2="60" y2="268" class="d-ax"/><line x1="230" y1="256" x2="230" y2="268" class="d-ax"/><line x1="660" y1="256" x2="660" y2="268" class="d-ax"/><line x1="60" y1="262" x2="230" y2="262" stroke="var(--accent,#0b6e4f)" stroke-width="3"/><text x="145" y="280" class="d-k" text-anchor="middle">range window</text><text x="445" y="280" class="d-s" text-anchor="middle">rest of session</text><text x="40" y="320" class="d-s" text-anchor="start">The range window, the confirmation and the exit differ book by book; the shape of the trade does not.</text></svg>
