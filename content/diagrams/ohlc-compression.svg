<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="ohlc-compression-t ohlc-compression-d" class="diagram"><title id="ohlc-compression-t">What a bar keeps and what it discards</title><desc id="ohlc-compression-d">A path of individual trades inside one period, collapsed into a single candle whose four prices are the only surviving record.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="330" rx="8" class="d-bg"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#0b6e4f)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2,#b8862b)"/></marker></defs><text x="40" y="34" class="d-t" text-anchor="start">Everything that happened</text><text x="40" y="56" class="d-s" text-anchor="start">in one period</text><polyline points="70.0,186.0 84.0,206.0 100.0,178.0 118.0,150.0 132.0,162.0 148.0,122.0 164.0,140.0 180.0,108.0 196.0,132.0 212.0,100.0 228.0,128.0 244.0,160.0 258.0,144.0 274.0,176.0 288.0,158.0 302.0,168.0" class="d-px" style="stroke-width:1.2;opacity:.75"/><circle cx="70" cy="186" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="84" cy="206" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="100" cy="178" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="118" cy="150" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="132" cy="162" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="148" cy="122" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="164" cy="140" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="180" cy="108" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="196" cy="132" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="212" cy="100" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="228" cy="128" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="244" cy="160" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="258" cy="144" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="274" cy="176" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="288" cy="158" r="2.6" fill="var(--muted,#6b6b66)"/><circle cx="302" cy="168" r="2.6" fill="var(--muted,#6b6b66)"/><line x1="330" y1="150" x2="392" y2="150" stroke="var(--accent,#0b6e4f)" stroke-width="2" marker-end="url(#ar)"/><text x="361" y="140" class="d-k" text-anchor="middle">becomes</text><line x1="470" y1="100" x2="470" y2="206" stroke="var(--fg,#1c1c1a)" stroke-width="1.6"/><rect x="452" y="168" width="36" height="18" class="d-up"/><line x1="490" y1="100" x2="526" y2="100" class="d-grid"/><text x="532" y="104" class="d-s" text-anchor="start">high</text><line x1="490" y1="168" x2="526" y2="168" class="d-grid"/><text x="532" y="172" class="d-s" text-anchor="start">close</text><line x1="490" y1="186" x2="526" y2="186" class="d-grid"/><text x="532" y="190" class="d-s" text-anchor="start">open</text><line x1="490" y1="206" x2="526" y2="206" class="d-grid"/><text x="532" y="210" class="d-s" text-anchor="start">low</text><text x="470" y="78" class="d-t" text-anchor="middle">one bar</text><text x="40" y="240" class="d-s" text-anchor="start">Gone, and not recoverable from the chart: the order the ticks arrived in, how much traded at each</text><text x="40" y="258" class="d-s" text-anchor="start">price, whether one large participant or ten thousand small ones, and whether the high came before</text><text x="40" y="276" class="d-s" text-anchor="start">the low or after.</text><text x="40" y="306" class="d-k" text-anchor="start">The longer the bar, the more it discards. A monthly candle is four numbers standing in for a month.</text></svg>
