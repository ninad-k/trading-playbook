<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="option-payoffs-t option-payoffs-d" class="diagram"><title id="option-payoffs-t">Four basic option payoff shapes</title><desc id="option-payoffs-d">Expiry payoff diagrams for a long call, a long put, a covered call and a vertical spread.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="310" rx="8" class="d-bg"/><text x="40" y="30" class="d-t" text-anchor="start">Payoff at expiry — profit above the line, loss below</text><line x1="52" y1="135.0" x2="184" y2="135.0" class="d-ax"/><line x1="52" y1="80" x2="52" y2="190" class="d-ax"/><polyline points="52.0,159.8 118.0,159.8 184.0,88.2" class="d-hi"/><text x="118.0" y="68" class="d-t" text-anchor="middle">Long call</text><text x="118.0" y="214" class="d-s" text-anchor="middle">loss capped at the premium</text><line x1="224" y1="135.0" x2="356" y2="135.0" class="d-ax"/><line x1="224" y1="80" x2="224" y2="190" class="d-ax"/><polyline points="224.0,88.2 290.0,159.8 356.0,159.8" class="d-hi"/><text x="290.0" y="68" class="d-t" text-anchor="middle">Long put</text><text x="290.0" y="214" class="d-s" text-anchor="middle">gains as price falls</text><line x1="396" y1="135.0" x2="528" y2="135.0" class="d-ax"/><line x1="396" y1="80" x2="396" y2="190" class="d-ax"/><polyline points="396.0,184.5 462.0,107.5 528.0,107.5" class="d-hi"/><text x="462.0" y="68" class="d-t" text-anchor="middle">Covered call</text><text x="462.0" y="214" class="d-s" text-anchor="middle">upside sold for income</text><line x1="568" y1="135.0" x2="700" y2="135.0" class="d-ax"/><line x1="568" y1="80" x2="568" y2="190" class="d-ax"/><polyline points="568.0,162.5 614.2,162.5 660.4,107.5 700.0,107.5" class="d-hi"/><text x="634.0" y="68" class="d-t" text-anchor="middle">Vertical spread</text><text x="634.0" y="214" class="d-s" text-anchor="middle">both sides capped</text><text x="40" y="248" class="d-s" text-anchor="start">Every options position in the notes reduces to one of these shapes, or a combination of them.</text><text x="40" y="266" class="d-s" text-anchor="start">The horizontal line is break-even, not zero price.</text><text x="40" y="288" class="d-s" text-anchor="start">Axes are unscaled: the point is the shape, not any particular strike or premium.</text></svg>
