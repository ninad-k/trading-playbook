<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="volume-profile-t volume-profile-d" class="diagram"><title id="volume-profile-t">Volume profile with point of control and value area</title><desc id="volume-profile-d">A horizontal histogram of volume traded at each price, the widest row marked as the point of control and a shaded band covering the value area, with a faint price line beside it.</desc><style>
.d-bg{fill:var(--card,#ffffff)}
.d-ax{stroke:var(--line,#e4e2dc);stroke-width:1}
.d-grid{stroke:var(--line,#e4e2dc);stroke-width:1;stroke-dasharray:3 4}
.d-px{fill:none;stroke:var(--fg,#1c1c1a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d-hi{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-hi2{fill:none;stroke:var(--accent2,#b8862b);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.d-dash{fill:none;stroke:var(--accent,#0b6e4f);stroke-width:1.6;stroke-dasharray:5 4}
.d-t{fill:var(--fg,#1c1c1a);font:600 13px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-s{fill:var(--muted,#6b6b66);font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k{fill:var(--accent,#0b6e4f);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-k2{fill:var(--accent2,#b8862b);font:600 12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.d-up{fill:var(--card,#ffffff);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-dn{fill:var(--fg,#1c1c1a);stroke:var(--fg,#1c1c1a);stroke-width:1.5}
.d-zone{fill:var(--accent,#0b6e4f);opacity:.10}
.d-zone2{fill:var(--accent2,#b8862b);opacity:.12}
</style><rect x="0" y="0" width="720" height="348" rx="8" class="d-bg"/><rect x="300" y="100" width="392" height="128" class="d-zone"/><rect x="300" y="54" width="26" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="70" width="40" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="86" width="64" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="102" width="96" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="118" width="150" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="134" width="196" height="12" style="fill:var(--accent,#0b6e4f)"/><rect x="300" y="150" width="168" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="166" width="118" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="182" width="74" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="198" width="92" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="214" width="138" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="230" width="70" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><rect x="300" y="246" width="34" height="12" style="fill:var(--muted,#6b6b66);opacity:.5"/><line x1="300" y1="40" x2="300" y2="272" class="d-ax"/><polyline points="322.0,250.0 370.0,190.0 410.0,214.0 462.0,150.0 512.0,176.0 562.0,120.0 612.0,152.0 666.0,98.0" class="d-px" style="opacity:.45"/><line x1="300" y1="140" x2="692" y2="140" class="d-dash"/><text x="294" y="144" class="d-k" text-anchor="end">POC</text><text x="294" y="112" class="d-s" text-anchor="end">value area high</text><text x="294" y="224" class="d-s" text-anchor="end">value area low</text><text x="40" y="34" class="d-t" text-anchor="start">Volume at price</text><text x="40" y="62" class="d-s" text-anchor="start">Each bar is how much traded</text><text x="40" y="80" class="d-s" text-anchor="start">at that price, not when.</text><text x="40" y="116" class="d-s" text-anchor="start">The widest row is the point</text><text x="40" y="134" class="d-s" text-anchor="start">of control: the price the</text><text x="40" y="152" class="d-s" text-anchor="start">market spent most effort</text><text x="40" y="170" class="d-s" text-anchor="start">agreeing on.</text><text x="40" y="208" class="d-s" text-anchor="start">The shaded band holds</text><text x="40" y="226" class="d-s" text-anchor="start">roughly 70% of the volume</text><text x="40" y="244" class="d-s" text-anchor="start">traded.</text><text x="40" y="300" class="d-s" text-anchor="start">Thin rows are prices the market moved through quickly and tends not to linger in.</text><text x="40" y="322" class="d-k" text-anchor="start">This is where the support and resistance zones from stage 3 actually come from.</text></svg>
