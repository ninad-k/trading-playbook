{% extends "base.html" %}
{% block title %}Search · {{ site_title }}{% endblock %}
{% block content %}
<article>
  <h1>Search</h1>
  <p class="muted">Full-text search over every book note, system and topic. Try <em>kelly</em>, <em>turtle</em>, <em>divergence</em>, <em>pivot points</em>, <em>expectancy</em>.</p>
  <form id="sform" class="sform" onsubmit="return false">
    <input id="q" type="search" placeholder="Search…" autofocus>
    <select id="fcat"><option value="">All categories</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
    <select id="ftier"><option value="">Any tier</option><option value="A">Tier A (deep)</option><option value="B">Tier B (concise)</option></select>
    <select id="fdiff"><option value="">Any level</option><option>beginner</option><option>intermediate</option><option>advanced</option></select>
    <select id="ftype"><option value="">Any type</option><option>book</option><option>course</option><option>article</option><option>paper</option><option>manual</option><option>system</option></select>
  </form>
  <p id="status" class="muted">Loading index…</p>
  <ol id="results" class="results"></ol>
</article>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script>
(async function(){
  const res = await fetch('search-index.json'); const docs = await res.json();
  const byId = {}; docs.forEach(d=>byId[d.slug]=d);
  const idx = lunr(function(){
    this.ref('slug'); this.field('title',{boost:10}); this.field('author',{boost:6}); this.field('tags',{boost:6});
    this.field('one_liner',{boost:3}); this.field('text');
    this.pipeline.remove(lunr.stemmer); this.searchPipeline.remove(lunr.stemmer);
    docs.forEach(d=>this.add(d));
  });
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search); if(params.get('q')) $('q').value=params.get('q');
  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function snippet(d,q){ const t=d.text||''; const i=t.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return t.slice(0,180); return '…'+t.slice(Math.max(0,i-80),i+120)+'…'; }
  function run(){
    const q=$('q').value.trim(); const cat=$('fcat').value, tier=$('ftier').value, diff=$('fdiff').value, type=$('ftype').value;
    let hits;
    if(q){ try{ hits = idx.search(q.split(/\s+/).map(w=>w.length>2?w+'^1 '+w+'*':w).join(' ')).map(h=>byId[h.ref]); }catch(e){ hits = idx.search(q).map(h=>byId[h.ref]); } }
    else hits = docs.slice().sort((a,b)=>a.title.localeCompare(b.title));
    hits = hits.filter(d=>(!cat||d.category===cat)&&(!tier||d.tier===tier)&&(!diff||d.difficulty===diff)&&(!type||d.doc_type===type));
    $('status').textContent = hits.length+' result'+(hits.length===1?'':'s')+(q?' for “'+q+'”':'');
    $('results').innerHTML = hits.slice(0,200).map(d=>`<li><a href="books/${d.slug}.html">${esc(d.title)}</a> <span class="muted">${esc(d.author)}${d.year&&d.year!=='unknown'?' · '+esc(d.year):''}</span> <span class="badge tier-${d.tier}">${d.tier}</span> <span class="badge">${esc(d.doc_type)}</span><br><span>${esc(d.one_liner)}</span>${q?'<br><small class="muted">'+esc(snippet(d,q))+'</small>':''}<br><small class="muted">${esc(d.category)} · ${esc(d.tags)}</small></li>`).join('');
  }
  ['q','fcat','ftier','fdiff','ftype'].forEach(id=>$(id).addEventListener('input',run));
  run();
})();
</script>
{% endblock %}
